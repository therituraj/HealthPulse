<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="HealthPulse - Your Personal Health Companion for accurate and free health assessments.Unlock a healthier you with HealthPulse! 🌐 Your go-to for free, instant health assessments using cutting-edge technology. Get personalized insights for diabetes, brain tumors, and heart diseases. Take control of your well-being today! 💪🩺 #HealthTech #Wellness #HealthPulse">
    <meta name="keywords" content="HealthPulse, health, assessment, machine learning, web application">
    <meta name="author" content="Rituraj">

    <!-- SEO Meta Tags -->
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="google" content="notranslate">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="HealthPulse">
    <meta property="og:description" content="Your Personal Health Companion for accurate and free health assessments.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://healthpulse.vercel.app/">
    <meta property="og:image" content="https://healthpulse.vercel.app/static/img/healthpulse.png">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="Unlock a healthier you with HealthPulse! 🌐 Your go-to for free, instant health assessments using cutting-edge technology. Get personalized insights for diabetes, brain tumors, and heart diseases. Take control of your well-being today! 💪🩺 #HealthTech #Wellness #HealthPulse">
    <meta name="twitter:title" content="HealthPulse">
    <meta name="twitter:description" content="Your Personal Health Companion for accurate and free health assessments.">
    <meta name="twitter:image" content="https://healthpulse.vercel.app/static/img/healthpulse.png">

    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    {% block title %}{% endblock title %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
    
<header>
    <!-- Navbar -->
    <nav class="lp-nav" id="lpNav">
        <div class="lp-wrap">

            <!-- Logo -->
            <a href="/" class="lp-logo">
                <i class='bx bx-shield-plus'></i>
                Health<span>Pulse</span>
            </a>

            <!-- Mobile Toggle -->
            <button class="lp-toggle" id="lpToggle"
                    aria-label="Open menu"
                    aria-expanded="false"
                    aria-controls="lpMenu">
                <i class='bx bx-menu'></i>
            </button>

            <!-- Navigation Links -->
            <div class="lp-menu" id="lpMenu">

                <a href="/diabetes">Diabetes</a>
                <a href="/heart_diseases">Heart Diseases</a>

                {% if user %}

                    <!-- User Dropdown -->
                    <div class="lp-user-dropdown" data-dropdown>
                        <a href="#" class="lp-user-btn" data-dropdown-button>
                            <i class='bx bx-user-circle'></i>
                            <span>{{ user.name | default('N/A') }}</span>
                            <i class='bx bx-chevron-down'></i>
                        </a>

                        <div class="lp-dropdown-menu">
                            <a href="{{ url_for('my_profile') }}">
                                <i class='bx bx-user'></i> My Profile
                            </a>

                            <a href="{{ url_for('my_reports') }}">
                                <i class='bx bx-file'></i> My Reports
                            </a>

                            <a href="{{ url_for('change_password') }}">
                                <i class='bx bx-lock'></i> Change Password
                            </a>

                            <a href="{{ url_for('logout') }}">
                                <i class='bx bx-log-out'></i> Logout
                            </a>
                        </div>
                    </div>

                {% else %}

                    <a href="{{ url_for('login') }}">Sign in</a>

                    <a href="{{ url_for('register') }}"
                       class="lp-btn primary">
                        Get started
                    </a>

                {% endif %}

            </div>
        </div>
    </nav>
</header>

        
    {% block content %}{% endblock content %}
    


    <!-- <script src="./../../static/js/script.js"></script> -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
